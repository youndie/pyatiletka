# B-17: the page on GitHub Pages. Every push to main builds the wasm page and publishes it into
# gh-pages, keeping the snapshot already there (endpoint-snapshot). The hourly snapshot workflow writes
# the same branch; both are in one concurrency group, so they run one after the other and neither
# loses the other's file (research, risk 6).
name: page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/sborka/.github/actions/setup-kotlin@v0.5.0.135

      - run: ./gradlew :app:wasmJsBrowserDistribution --no-daemon

      - run: .github/scripts/publish-to-pages.sh page app/build/dist/wasmJs/productionExecutable
