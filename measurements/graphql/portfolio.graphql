# The whole board in one request: every public repository of one owner with what the board and the
# repository card need (B-02). Page sizes are the API's maxima for the outer list and generous ones
# for the inner lists; `pageInfo` says whether any list was cut.
query Portfolio($owner: String!, $first: Int!, $after: String) {
  rateLimit { cost remaining resetAt }
  repositoryOwner(login: $owner) {
    repositories(first: $first, after: $after, privacy: PUBLIC, ownerAffiliations: OWNER, orderBy: { field: PUSHED_AT, direction: DESC }) {
      totalCount
      pageInfo { hasNextPage endCursor }
      nodes {
        nameWithOwner
        visibility
        isArchived
        isFork
        pushedAt
        defaultBranchRef {
          name
          target {
            ... on Commit {
              oid
              statusCheckRollup {
                state
                contexts(first: 50) {
                  totalCount
                  pageInfo { hasNextPage }
                  nodes {
                    __typename
                    ... on CheckRun { name status conclusion detailsUrl }
                    ... on StatusContext { context state targetUrl }
                  }
                }
              }
            }
          }
        }
        pullRequests(states: OPEN, first: 50, orderBy: { field: CREATED_AT, direction: ASC }) {
          totalCount
          pageInfo { hasNextPage }
          nodes {
            number
            title
            isDraft
            createdAt
            url
            author { __typename login }
            commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
          }
        }
        backlog: object(expression: "HEAD:backlog.md") { ... on Blob { byteSize text } }
        flatBacklog: object(expression: "HEAD:BACKLOG.md") { ... on Blob { byteSize } }
      }
    }
  }
}
