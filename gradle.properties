org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official

version=0.1.0

# What the shared conventions read (`io.github.youndie.sborka`).
sborka.group=io.github.youndie.pyatiletka
sborka.repository=youndie/pyatiletka
sborka.description=A portfolio board, and the first consumer of the plakat-ui and toon-ui kits.
sborka.inceptionYear=2026
sborka.licence=MIT License
sborka.jvmFloor=25
# An application, not a library: explicit API mode guards a published surface this repository does
# not have.
sborka.explicitApi=false

# The wasmJs target is the reason: the Kotlin plugin declares repositories on the project for Node,
# Yarn and Binaryen, and the two stricter modes break it (both kits met the same).
sborka.repositoriesMode=PREFER_PROJECT
